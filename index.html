<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>人生记录仪</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header" aria-label="登录与云同步">
      <div class="auth-copy">
        <strong id="cloudStatus">正在连接</strong>
        <span id="cloudHint">登录后即可在所有设备上同步记录。</span>
      </div>
      <form id="loginForm" class="login-form">
        <input id="emailInput" type="email" autocomplete="email" placeholder="邮箱" required />
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="密码" required />
        <button id="loginBtn" class="primary" type="submit">登录</button>
      </form>
      <div class="header-actions">
        <button id="exportBtn" type="button">导出</button>
        <label class="import-btn">
          导入
          <input id="importInput" type="file" accept="application/json" />
        </label>
        <button id="syncBtn" type="button" hidden>同步</button>
        <button id="logoutBtn" type="button" hidden>退出登录</button>
      </div>
    </header>

    <main class="layout" id="appContent" hidden>
      <section class="mode-banner" id="modeBanner" hidden></section>

      <details class="capture-panel" id="capturePanel">
        <summary class="capture-summary">
          <span>添加记录</span>
        </summary>
        <div class="capture-panel-body">
          <div class="douban-box compact">
          <h2>豆瓣浏览器采集</h2>
          <a class="bookmarklet" id="doubanBookmarklet" href="#">豆瓣采集到记录库</a>
          <div class="hint">
            Mac 上把这个按钮拖到 Chrome 或 Safari 的书签栏。打开豆瓣条目页后点书签，会把标题、海报、类型、年份、主创等资料加入记录库。
          </div>
        </div>

          <div class="manual-box">
            <h2>手动添加</h2>
            <form id="manualForm" class="lookup-form">
          <label>
            作品名
            <input name="title" required placeholder="例如：漫长的季节 / 三体 / 置身事内" autocomplete="off" />
          </label>
          <div class="field-row">
            <label>
              类型
              <select name="type">
                <option value="book">书籍</option>
                <option value="movie">电影</option>
                <option value="series">电视剧</option>
                <option value="variety">综艺</option>
                <option value="anime">动画</option>
                <option value="podcast">播客</option>
                <option value="game">游戏</option>
                <option value="music">音乐</option>
              </select>
            </label>
            <label>
              状态
              <select name="status">
                <option value="done">已看/读完</option>
                <option value="watching">进行中</option>
                <option value="planned">想读/待读</option>
              </select>
            </label>
            <label>
              我的评分
              <input name="rating" type="number" min="0" max="10" step="0.5" placeholder="0-10 可选" />
            </label>
            <label>
              年份
              <input name="year" placeholder="例如：2025" />
            </label>
          </div>
          <input name="startDate" type="hidden" />
          <input name="date" type="hidden" />
          <input name="endDate" type="hidden" />
          <input name="dateSegments" type="hidden" />
          <section class="date-picker" data-date-picker="manual">
            <div class="date-picker-head">
              <h3>日期记录</h3>
              <div class="segment-control" role="group" aria-label="日期选择模式">
                <button class="active" data-mode="single" type="button">单日</button>
                <button data-mode="range" type="button">区间</button>
              </div>
            </div>
            <div class="mini-calendar-head">
              <button data-calendar-prev type="button">上个月</button>
              <strong data-calendar-title></strong>
              <button data-calendar-next type="button">下个月</button>
            </div>
            <div class="mini-weekdays">
              <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
            </div>
            <div class="mini-calendar-grid" data-calendar-grid></div>
            <div class="selected-segments" data-selected-segments></div>
          </section>
          <label>
            海报链接
            <input name="poster" placeholder="可选，图片 URL" />
          </label>
          <label>
            备注
            <textarea name="notes" rows="4" placeholder="自己的评价、观看渠道、想法"></textarea>
          </label>
          <button class="primary" type="submit">添加记录</button>
            </form>
            <div class="results" id="lookupResults"></div>
          </div>
        </div>
      </details>

      <section class="library-panel" aria-label="记录列表">
        <div class="toolbar">
          <div class="search-box">
            <input id="searchInput" placeholder="搜索标题、主创、主演、类型、备注" />
          </div>
          <div class="filters" role="tablist" aria-label="类型筛选">
            <button class="active" data-filter="all" type="button">全部</button>
            <button data-filter="book" type="button">书</button>
            <button data-filter="movie" type="button">电影</button>
            <button data-filter="series" type="button">剧</button>
            <button data-filter="anime" type="button">动画</button>
            <button data-filter="variety" type="button">综艺</button>
          </div>
          <div class="view-tabs" role="tablist" aria-label="视图切换">
            <button class="active" data-view="table" type="button">汇总表</button>
            <button data-view="cards" type="button">卡片墙</button>
            <button data-view="calendar" type="button">日历表</button>
          </div>
        </div>

        <div class="stats" id="stats"></div>
        <div class="items" id="items"></div>
        <div class="table-wrap" id="tableWrap" hidden>
          <table class="summary-table">
            <thead>
              <tr>
                <th><button data-sort="title" type="button">标题</button></th>
                <th><button data-sort="type" type="button">类型</button></th>
                <th><button data-sort="year" type="button">年份</button></th>
                <th><button data-sort="creator" type="button">主创/作者</button></th>
                <th><button data-sort="cast" type="button">主演</button></th>
                <th><button data-sort="genres" type="button">类别</button></th>
                <th><button data-sort="source" type="button">来源</button></th>
                <th><button data-sort="status" type="button">状态</button></th>
                <th><button data-sort="date" type="button">完成日期</button></th>
                <th><button data-sort="rating" type="button">评分</button></th>
              </tr>
            </thead>
            <tbody id="summaryBody"></tbody>
          </table>
        </div>
        <section class="calendar-view" id="calendarView" hidden>
          <div class="calendar-head">
            <button id="prevMonthBtn" type="button">上个月</button>
            <h2 id="calendarTitle"></h2>
            <button id="nextMonthBtn" type="button">下个月</button>
          </div>
          <div class="calendar-grid calendar-weekdays">
            <div>周一</div>
            <div>周二</div>
            <div>周三</div>
            <div>周四</div>
            <div>周五</div>
            <div>周六</div>
            <div>周日</div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
          <div class="calendar-selection" id="calendarSelection"></div>
        </section>
        <section class="detail-view" id="detailView" hidden>
          <div class="detail-head">
            <button id="backToTableBtn" type="button">返回汇总表</button>
            <button id="backToCardsBtn" type="button">返回卡片墙</button>
            <button id="backToCalendarBtn" type="button">返回日历表</button>
          </div>
          <form id="detailForm" class="detail-form">
            <div class="detail-grid">
              <label class="poster-editor">
                海报
                <img id="detailPosterPreview" alt="海报预览" />
                <input name="poster" placeholder="海报图片链接" />
              </label>
              <div class="detail-fields">
                <div class="field-row">
                  <label>
                    标题
                    <input name="title" required />
                  </label>
                  <label>
                    类型
                    <select name="type">
                      <option value="book">书籍</option>
                      <option value="movie">电影</option>
                      <option value="series">电视剧</option>
                      <option value="variety">综艺</option>
                      <option value="anime">动画</option>
                      <option value="podcast">播客</option>
                      <option value="game">游戏</option>
                      <option value="music">音乐</option>
                    </select>
                  </label>
                </div>
                <div class="field-row">
                  <label>
                    年份
                    <input name="year" />
                  </label>
                  <label>
                    评分
                    <input name="rating" type="number" min="0" max="10" step="0.5" />
                  </label>
                </div>
                <label>
                  主创 / 作者
                  <input name="creator" />
                </label>
                <label>
                  导演
                  <input name="director" />
                </label>
                <label>
                  主演
                  <input name="cast" placeholder="用 / 分隔" />
                </label>
                <label>
                  类别
                  <input name="genres" placeholder="用 / 分隔" />
                </label>
                <div class="field-row">
                  <label>
                    状态
                    <select name="status">
                      <option value="done">已看/读完</option>
                      <option value="watching">进行中</option>
                      <option value="planned">想读/待读</option>
                    </select>
                  </label>
                </div>
                <input name="startDate" type="hidden" />
                <input name="date" type="hidden" />
                <input name="endDate" type="hidden" />
                <input name="dateSegments" type="hidden" />
                <section class="date-picker" data-date-picker="detail">
                  <div class="date-picker-head">
                    <h3>日期记录</h3>
                    <div class="segment-control" role="group" aria-label="日期选择模式">
                      <button class="active" data-mode="single" type="button">单日</button>
                      <button data-mode="range" type="button">区间</button>
                    </div>
                  </div>
                  <div class="mini-calendar-head">
                    <button data-calendar-prev type="button">上个月</button>
                    <strong data-calendar-title></strong>
                    <button data-calendar-next type="button">下个月</button>
                  </div>
                  <div class="mini-weekdays">
                    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                  </div>
                  <div class="mini-calendar-grid" data-calendar-grid></div>
                  <div class="selected-segments" data-selected-segments></div>
                </section>
                <label>
                  来源链接
                  <input name="sourceUrl" />
                </label>
                <label>
                  简介
                  <textarea name="description" rows="5"></textarea>
                </label>
                <label>
                  我的备注
                  <textarea name="notes" rows="4"></textarea>
                </label>
                <div class="detail-actions">
                  <button class="primary" type="submit">保存修改</button>
                  <button id="deleteDetailBtn" type="button">删除记录</button>
                </div>
              </div>
            </div>
          </form>
        </section>
      </section>
    </main>

    <template id="resultTemplate">
      <article class="result-card">
        <img class="result-poster" alt="" hidden />
        <div class="result-body">
          <div class="item-top">
            <span class="pill"></span>
            <button class="add-result" type="button">加入</button>
          </div>
          <h3></h3>
          <p class="meta"></p>
          <p class="notes"></p>
        </div>
      </article>
    </template>

    <template id="itemTemplate">
      <article class="item-card">
        <img class="item-image" alt="" hidden />
        <div class="item-body">
          <div class="item-top">
            <span class="pill"></span>
            <button class="delete-btn" type="button" aria-label="删除">删除</button>
          </div>
          <h3></h3>
          <p class="meta"></p>
          <p class="people"></p>
          <p class="notes"></p>
          <div class="tag-list"></div>
          <a class="source-link" target="_blank" rel="noreferrer">查看来源</a>
        </div>
      </article>
    </template>

    <script src="./config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js"></script>
  </body>
</html>
